# §WALK-4 Inc 2 / §WALK-5 — CI gate for the terrain-field invariants + walk parity + MUD harness.
#
# Job `invariants` runs `check:walk` — the whole gate chain, which is named in
# `src/scripts/run-gates.js` and is stdlib-only: no server, no browser, no install.
# A `check:*` script that is not in that chain fails the runner before any gate starts.
#
# Job `mud` (§WALK-5 Inc 3/4) holds every harness that needs a LIVE server, which is
# why it is the one job that runs `npm ci`: the server top-level-requires the Anthropic
# SDK, so none of them can ride the stdlib-only `invariants` job above. It spins a
# throwaway wbapi-server and drives K seeded SSE clients to assert co-presence broadcast,
# instanced no-bleed encounters and idle-TTL prune (§WALK-5), then calls every endpoint,
# collection and enum value `GET /api/help` claims (§DX-02jg(b)).
#
# Red on any gate failure, MUD-property failure or help-conformance finding; green on
# current main.
name: WALK invariants

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/js/mover.js'
      - 'play.html'
      - 'src/js/wbapi-server.js'
      - 'src/js/wbapi-core.js'
      - 'src/scripts/run-gates.js'
      - 'src/scripts/check-invariants.js'
      - 'src/scripts/check-mover-parity.js'
      - 'src/scripts/check-mover-behaviour.js'
      - 'src/scripts/check-terrain-parity.js'
      - 'src/scripts/check-noderegs.js'
      - 'src/scripts/check-array-patch.js'
      - 'src/js/duel.js'
      - 'src/scripts/check-duel-parity.js'
      - 'src/scripts/check-itemchain.js'
      - 'src/scripts/check-ladder-migration.js'
      - 'src/scripts/world-diff.js'
      - 'src/tests/mud-harness.mjs'
      - 'src/tests/help-behaviour.mjs'
      - 'src/api/wb.js'
      - 'src/package.json'
      - '.github/workflows/walk-invariants.yml'
  pull_request:
    paths:
      - 'src/js/mover.js'
      - 'play.html'
      - 'src/js/wbapi-server.js'
      - 'src/js/wbapi-core.js'
      - 'src/scripts/run-gates.js'
      - 'src/scripts/check-invariants.js'
      - 'src/scripts/check-mover-parity.js'
      - 'src/scripts/check-mover-behaviour.js'
      - 'src/scripts/check-terrain-parity.js'
      - 'src/scripts/check-noderegs.js'
      - 'src/scripts/check-array-patch.js'
      - 'src/js/duel.js'
      - 'src/scripts/check-duel-parity.js'
      - 'src/scripts/check-itemchain.js'
      - 'src/scripts/check-ladder-migration.js'
      - 'src/scripts/world-diff.js'
      - 'src/tests/mud-harness.mjs'
      - 'src/tests/help-behaviour.mjs'
      - 'src/api/wb.js'
      - 'src/package.json'
      - '.github/workflows/walk-invariants.yml'

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      # No `npm ci` — these proofs depend only on the Node stdlib and the
      # committed mover.js / play.html, so install would just pull
      # Playwright + the SDK for nothing.
      - name: Run the check:walk gate chain
        run: npm run check:walk --prefix src

  mud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json
      # The MUD harness boots the real wbapi-server, which top-level-requires the
      # Anthropic SDK — so unlike the `invariants` job this one needs an install.
      - name: Install dependencies
        run: npm ci --prefix src
      - name: Run MUD multi-client harness (co-presence + instancing + TTL prune)
        run: npm run test:mud --prefix src
      - name: Run help behavioural conformance (every documented endpoint is called)
        run: npm run test:help --prefix src
