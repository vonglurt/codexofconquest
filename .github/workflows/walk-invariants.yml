# §WALK-4 Inc 2 / §WALK-5 — CI gate for the terrain-field invariants + walk parity + MUD harness.
#
# Job `invariants` runs the self-contained Node proofs (no server, no browser, no install):
#   • check-invariants  — I1 totality / I2 no-stubs / I3 reachability (409/409, 1 component)
#   • check-mover-parity     — structural: MOVER:CORE inlined byte-identical to mover.js
#   • check-mover-behaviour  — behavioural: shared kernel reproduces every cellMove decision
#   • check-terrain-parity   — §WALK-5: server getMoverWorld() terrain/encounter inputs
#                              (rate table, SEA_LANES, terrainAt) match the client byte-for-behaviour
#
# Job `mud` (§WALK-5 Inc 3/4) spins a throwaway wbapi-server and drives K seeded
# SSE clients to assert co-presence broadcast, instanced no-bleed encounters, and
# idle-TTL prune. It needs `npm ci` because the server top-level-requires the
# Anthropic SDK, so it can't ride the stdlib-only `invariants` job above.
#
# Red on any I1/I2/I3 violation, parity mismatch, or MUD-property failure;
# green on current main (lab report §6).
name: WALK invariants

on:
  push:
    paths:
      - 'src/js/mover.js'
      - 'play.html'
      - 'src/js/wbapi-server.js'
      - 'src/js/wbapi-core.js'
      - 'src/scripts/check-invariants.js'
      - 'src/scripts/check-mover-parity.js'
      - 'src/scripts/check-mover-behaviour.js'
      - 'src/scripts/check-terrain-parity.js'
      - 'src/scripts/check-noderegs.js'
      - 'src/scripts/check-array-patch.js'
      - 'src/scripts/check-itemchain.js'
      - 'src/scripts/check-ladder-migration.js'
      - 'src/scripts/world-diff.js'
      - 'src/tests/mud-harness.mjs'
      - 'src/api/wb.js'
      - 'src/package.json'
      - '.github/workflows/walk-invariants.yml'
  pull_request:
    paths:
      - 'src/js/mover.js'
      - 'play.html'
      - 'src/js/wbapi-server.js'
      - 'src/js/wbapi-core.js'
      - 'src/scripts/check-invariants.js'
      - 'src/scripts/check-mover-parity.js'
      - 'src/scripts/check-mover-behaviour.js'
      - 'src/scripts/check-terrain-parity.js'
      - 'src/scripts/check-noderegs.js'
      - 'src/scripts/check-array-patch.js'
      - 'src/scripts/check-itemchain.js'
      - 'src/scripts/check-ladder-migration.js'
      - 'src/scripts/world-diff.js'
      - 'src/tests/mud-harness.mjs'
      - 'src/api/wb.js'
      - 'src/package.json'
      - '.github/workflows/walk-invariants.yml'

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      # No `npm ci` — these proofs depend only on the Node stdlib and the
      # committed mover.js / play.html, so install would just pull
      # Playwright + the SDK for nothing.
      - name: Run terrain-field invariant + walk-parity suite
        run: npm run check:walk --prefix src
      # §WBAPI-01 ph3: structured-field PATCH round-trip guard — also stdlib-only
      # (requires wbapi-core, which pulls in just fs/path), loads the committed HTML
      # read-only. No install needed.
      - name: Run WBAPI structured-field PATCH guard
        run: npm run check:arraypatch --prefix src
      # §EDITOR-01-D: declarative itemChain runtime + source round-trip guard —
      # stdlib-only (vm + wbapi-core), loads the committed HTML read-only.
      - name: Run itemChain guard
        run: npm run check:itemchain --prefix src
      # §EDITOR-01-D-FU(b): reward-ladder → itemChain migration parity guard —
      # stdlib-only (vm + wbapi-core), loads the committed HTML read-only.
      - name: Run ladder-migration parity guard
        run: npm run check:laddermigration --prefix src
      # §MESH-01-FU 9: world-diff deep-diff selftest — stdlib-only (crypto +
      # wbapi-core), synthetic in-memory worlds, no HTML load.
      - name: Run world-diff selftest
        run: npm run check:worlddiff --prefix src

  mud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json
      # The MUD harness boots the real wbapi-server, which top-level-requires the
      # Anthropic SDK — so unlike the `invariants` job this one needs an install.
      - name: Install dependencies
        run: npm ci --prefix src
      - name: Run MUD multi-client harness (co-presence + instancing + TTL prune)
        run: npm run test:mud --prefix src
